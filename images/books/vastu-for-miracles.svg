<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#02231b"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#emeraldGrad)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="url(#goldGrad2)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="url(#goldGrad2)" stroke-width="1" opacity="0.4"/>

  <!-- Top Series Name -->
  <text x="300" y="90" fill="#fef08a" font-family="'Georgia', serif" font-size="14" letter-spacing="6" text-anchor="middle" font-weight="bold">AR BLESSINGS VASTU SHIKHAR</text>
  <line x1="200" y1="105" x2="400" y2="105" stroke="url(#goldGrad2)" stroke-width="1" opacity="0.6"/>

  <!-- Sacred Vastu Compass Centerpiece -->
  <g transform="translate(300, 310)" stroke="url(#goldGrad2)" stroke-width="1.5" fill="none">
    <circle r="115" stroke-dasharray="4,4"/>
    <circle r="90"/>
    <circle r="60"/>
    <!-- Compass 8 Directions -->
    <path d="M 0 -85 L 12 -20 L 0 0 L -12 -20 Z" fill="url(#goldGrad2)"/>
    <path d="M 0 85 L 12 20 L 0 0 L -12 20 Z" fill="#ca8a04" opacity="0.6"/>
    <path d="M 85 0 L 20 12 L 0 0 L 20 -12 Z" fill="#ca8a04" opacity="0.6"/>
    <path d="M -85 0 L -20 12 L 0 0 L -20 -12 Z" fill="#ca8a04" opacity="0.6"/>
    <text x="0" y="-95" fill="#fef08a" font-size="14" font-weight="bold" text-anchor="middle">उत्तर (NORTH)</text>
    <text x="0" y="112" fill="#fef08a" font-size="14" font-weight="bold" text-anchor="middle">दक्षिण (SOUTH)</text>
    <text x="115" y="5" fill="#fef08a" font-size="14" font-weight="bold">पूर्व</text>
    <text x="-125" y="5" fill="#fef08a" font-size="14" font-weight="bold" text-anchor="end">पश्चिम</text>
  </g>

  <!-- Title -->
  <text x="300" y="490" fill="url(#goldGrad2)" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="900" letter-spacing="2" text-anchor="middle">वास्तु और चमत्कार</text>
  <text x="300" y="530" fill="#ffffff" font-family="'Cinzel', 'Georgia', serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="middle">VASTU FOR MIRACLES</text>

  <text x="300" y="570" fill="#a7f3d0" font-family="'Helvetica Neue', sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">ALIGNING SACRED DIRECTIONS FOR WEALTH</text>
  <line x1="180" y1="595" x2="420" y2="595" stroke="url(#goldGrad2)" stroke-width="1.5" opacity="0.8"/>

  <text x="300" y="630" fill="#f8fafc" font-family="'Georgia', serif" font-size="14" font-style="italic" text-anchor="middle">Practical Space Cleansing &amp; Energy Magnetism</text>

  <!-- Author / Seal -->
  <g transform="translate(300, 710)">
    <text x="0" y="0" fill="#eab308" font-family="'Georgia', serif" font-size="13" letter-spacing="3" text-anchor="middle" font-weight="bold">ACHARYA RAJESH SHASTRI</text>
    <text x="0" y="20" fill="#6ee7b7" font-family="'Helvetica Neue', sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">MASTER VASTU ARCHITECT &amp; ASTROLOGER</text>
  </g>
</svg>
