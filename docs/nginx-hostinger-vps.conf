# ==============================================================================
# NGINX PRODUCTION CONFIGURATION FOR HOSTINGER VPS
# ==============================================================================
# Domain: arblessings.com (or your Hostinger VPS domain)
# Target Application: Next.js Node.js process (running on port 3000 via PM2 or systemd)
# ==============================================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt on Hostinger VPS)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root of the Next.js deployment
    root /var/app/arblessings-nextjs;

    # --------------------------------------------------------------------------
    # DEFENSE-IN-DEPTH: EXPLICITLY DENY DIRECT ACCESS TO PRIVATE E-BOOKS
    # --------------------------------------------------------------------------
    # This prevents any accidental static file exposure, bypassing of JWT checks,
    # or direct web downloads of unwatermarked source PDFs or cached copies.
    location ^~ /private-ebooks/ {
        deny all;
        return 404;
    }

    location ^~ /.env {
        deny all;
        return 404;
    }

    location ^~ /.git {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # REVERSE PROXY TO NEXT.JS NODE SERVER (PORT 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets / Next.js Fast Refresh
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward real client IP for abuse detection and security logs
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for responsive PDF streaming
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static Next.js assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
