      <line x1="0" y1="80" x2="0" y2="55"/>
      <line x1="-80" y1="0" x2="-55" y2="0"/>
      <line x1="80" y1="0" x2="55" y2="0"/>
      <line x1="-56" y1="-56" x2="-38" y2="-38"/>
      <line x1="56" y1="56" x2="38" y2="38"/>
      <line x1="-56" y1="56" x2="-38" y2="38"/>
