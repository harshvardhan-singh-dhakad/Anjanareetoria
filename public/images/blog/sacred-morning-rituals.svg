  </defs>
  <rect width="1200" height="630" fill="url(#blog1Grad)"/>
  
  <!-- Subtle spiritual circles -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="1000" cy="315" r="280"/>
    <circle cx="1000" cy="315" r="210"/>
