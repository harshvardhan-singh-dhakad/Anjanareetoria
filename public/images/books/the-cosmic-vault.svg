<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09051d"/>
      <stop offset="50%" stop-color="#1e1045"/>
      <stop offset="100%" stop-color="#0c072b"/>
    </linearGradient>
    <linearGradient id="celestialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#cosmicGrad)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="url(#celestialGold)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="url(#celestialGold)" stroke-width="1" opacity="0.4"/>

  <!-- Top Series Name -->
  <text x="300" y="90" fill="#fef08a" font-family="'Georgia', serif" font-size="14" letter-spacing="6" text-anchor="middle" font-weight="bold">EXCLUSIVE INSTANT E-BOOK GUIDE</text>
  <line x1="180" y1="105" x2="420" y2="105" stroke="url(#celestialGold)" stroke-width="1" opacity="0.6"/>

  <!-- Celestial Vault Graphic -->
  <g transform="translate(300, 310)" stroke="url(#celestialGold)" stroke-width="1.5" fill="none">
    <circle r="120" stroke-dasharray="3,3"/>
    <circle r="95"/>
    <circle r="65"/>
    <!-- Star of Abundance (12 Point Star) -->
    <path d="M 0 -85 L 20 -20 L 85 0 L 20 20 L 0 85 L -20 20 L -85 0 L -20 -20 Z" fill="none" stroke="url(#celestialGold)" stroke-width="1.5"/>
    <path d="M -60 -60 L -14 -14 L 0 0 L 14 -14 L 60 -60" stroke-width="1" opacity="0.6"/>
    <path d="M 60 60 L 14 14 L 0 0 L -14 14 L -60 60" stroke-width="1" opacity="0.6"/>
    <circle r="12" fill="url(#celestialGold)"/>
  </g>

  <!-- Title -->
  <text x="300" y="490" fill="url(#celestialGold)" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="900" letter-spacing="2" text-anchor="middle">द कॉस्मिक वॉल्ट</text>
  <text x="300" y="530" fill="#ffffff" font-family="'Cinzel', 'Georgia', serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="middle">THE COSMIC VAULT</text>

  <text x="300" y="570" fill="#ddd6fe" font-family="'Helvetica Neue', sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">ANCIENT SECRETS OF MONEY MAGNETISM</text>
  <line x1="180" y1="595" x2="420" y2="595" stroke="url(#celestialGold)" stroke-width="1.5" opacity="0.8"/>

  <text x="300" y="630" fill="#f8fafc" font-family="'Georgia', serif" font-size="14" font-style="italic" text-anchor="middle">Instant Digital Edition • High Resolution PDF &amp; Audio Guide</text>

  <!-- Author / Seal -->
  <g transform="translate(300, 710)">
    <text x="0" y="0" fill="#fbbf24" font-family="'Georgia', serif" font-size="13" letter-spacing="3" text-anchor="middle" font-weight="bold">AR BLESSINGS ESOTERIC ACADEMY</text>
    <text x="0" y="20" fill="#c4b5fd" font-family="'Helvetica Neue', sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">FAST DIGITAL DOWNLOAD ACCESS</text>
  </g>
</svg>
