<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#3f0717"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#rubyGrad)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="url(#roseGold)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="url(#roseGold)" stroke-width="1" opacity="0.4"/>

  <!-- Top Series Name -->
  <text x="300" y="90" fill="#fed7aa" font-family="'Georgia', serif" font-size="14" letter-spacing="6" text-anchor="middle" font-weight="bold">AR BLESSINGS MANIFESTATION JOURNAL</text>
  <line x1="180" y1="105" x2="420" y2="105" stroke="url(#roseGold)" stroke-width="1" opacity="0.6"/>

  <!-- Sacred Om & Mantra Circle -->
  <g transform="translate(300, 310)" stroke="url(#roseGold)" stroke-width="1.5" fill="none">
    <circle r="115" stroke-dasharray="2,5"/>
    <circle r="92"/>
    <circle r="68"/>
    <!-- Lotus Petals -->
    <g fill="none" stroke="url(#roseGold)" stroke-width="1.2">
      <path d="M 0 -68 C 15 -45, 15 -20, 0 0 C -15 -20, -15 -45, 0 -68 Z"/>
      <path d="M 0 68 C 15 45, 15 20, 0 0 C -15 20, -15 45, 0 68 Z"/>
      <path d="M -68 0 C -45 15, -20 15, 0 0 C -20 -15, -45 -15, -68 0 Z"/>
      <path d="M 68 0 C 45 15, 20 15, 0 0 C 20 -15, 45 -15, 68 0 Z"/>
    </g>
    <!-- Sacred Om Symbol in center -->
    <text x="0" y="20" fill="url(#roseGold)" font-size="62" font-family="'Georgia', serif" font-weight="bold" text-anchor="middle" stroke="none">ॐ</text>
  </g>

  <!-- Title -->
  <text x="300" y="490" fill="url(#roseGold)" font-family="'Cinzel', 'Georgia', serif" font-size="32" font-weight="900" letter-spacing="2" text-anchor="middle">दैनिक वैदिक मंत्र</text>
  <text x="300" y="530" fill="#ffffff" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="600" letter-spacing="4" text-anchor="middle">DAILY VEDIC MANTRAS</text>

  <text x="300" y="570" fill="#fecdd3" font-family="'Helvetica Neue', sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">&amp; 90-DAY MANIFESTATION WORKBOOK</text>
  <line x1="180" y1="595" x2="420" y2="595" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.8"/>

  <text x="300" y="630" fill="#f8fafc" font-family="'Georgia', serif" font-size="14" font-style="italic" text-anchor="middle">Awaken Financial Serenity &amp; Mental Clarity</text>

  <!-- Author / Seal -->
  <g transform="translate(300, 710)">
    <text x="0" y="0" fill="#f59e0b" font-family="'Georgia', serif" font-size="13" letter-spacing="3" text-anchor="middle" font-weight="bold">GURU DEVENDRA NATH</text>
    <text x="0" y="20" fill="#fbcfe8" font-family="'Helvetica Neue', sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">CONSECRATED PRACTICE GUIDE</text>
  </g>
</svg>
