<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020935"/>
      <stop offset="50%" stop-color="#0b1e6d"/>
      <stop offset="100%" stop-color="#020826"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e19e"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#fdf3cd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b1e6d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad1)"/>
  <rect width="600" height="800" fill="url(#glow)"/>

  <!-- Ornate Border Frame -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Corner Accents -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 45 65 L 65 45 M 45 45 L 65 65"/>
    <path d="M 535 65 L 555 45 M 535 45 L 555 65"/>
    <path d="M 45 735 L 65 755 M 45 755 L 65 735"/>
    <path d="M 535 735 L 555 755 M 535 755 L 555 735"/>
  </g>

  <!-- Top Badge -->
  <text x="300" y="90" fill="#f5e19e" font-family="'Georgia', serif" font-size="14" letter-spacing="6" text-anchor="middle" font-weight="bold">AR BLESSINGS SPIRITUAL SERIES</text>
  <line x1="200" y1="105" x2="400" y2="105" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Sacred Geometry Mandala Centerpiece -->
  <g transform="translate(300, 310)" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.75">
    <circle r="120" stroke-dasharray="3,3"/>
    <circle r="95"/>
    <circle r="70"/>
    <circle r="45"/>
    <!-- Intersecting Triangles (Sri Yantra style) -->
    <polygon points="0,-85 73,42 -73,42"/>
    <polygon points="0,85 73,-42 -73,-42"/>
    <polygon points="0,-65 56,32 -56,32"/>
    <polygon points="0,65 56,-32 -56,-32"/>
    <circle r="8" fill="url(#goldGrad)"/>
  </g>

  <!-- Book Title -->
  <text x="300" y="490" fill="url(#goldGrad)" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="900" letter-spacing="2" text-anchor="middle">करोड़ों का रहस्य</text>
  <text x="300" y="530" fill="#ffffff" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="600" letter-spacing="4" text-anchor="middle">KARODON KA RAHASYA</text>

  <text x="300" y="570" fill="#cbd5e1" font-family="'Helvetica Neue', sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">THE SACRED SCIENCE OF WEALTH &amp; PROSPERITY</text>
  <line x1="180" y1="595" x2="420" y2="595" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>

  <text x="300" y="630" fill="#f8fafc" font-family="'Georgia', serif" font-size="14" font-style="italic" text-anchor="middle">Ancient Vedic Laws &amp; Modern Abundance Alignment</text>

  <!-- Author / Seal -->
  <g transform="translate(300, 710)">
    <text x="0" y="0" fill="#d4af37" font-family="'Georgia', serif" font-size="13" letter-spacing="3" text-anchor="middle" font-weight="bold">AR BLESSINGS RESEARCH GUILD</text>
    <text x="0" y="20" fill="#94a3b8" font-family="'Helvetica Neue', sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">AUTHENTIC CONSECRATED EDITION</text>
  </g>
</svg>
